<td class="col120 formatCol l">
    <span>{{positionTaking.betTypeName}}</span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}" ng-switch-when="true" ng-class-name="btnCopyAll" ng-model="$parent.$parent.isCopyAll"
            ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, positionTaking.betTypeId)" type="button" /></div>
</td>
<td class="col120 formatCol c b">
    <select ng-disabled="positionTaking.iS3" class="col60" ng-model="positionTaking.s3"
        ng-options="value for value in s3Range">
    </select>
</td>
<td class="col120 formatCol c b">
    <input class="chb" type="checkbox" ng-model="positionTaking.iS3" />
    <select ng-disabled="!positionTaking.iS3" class="col60" ng-model="positionTaking.uS3"
        ng-options="value for value in uS3Range">
    </select>
</td>
<td class="col120 formatCol c b">
    <select class="col60" ng-model="positionTaking.m3" ng-options="value for value in maxPTRange">
    </select>
</td>
<td class="col120 formatCol c b">
    <select class="col60" ng-model="positionTaking.n3" ng-options="value for value in minPTRange">
    </select>
</td>
<td class="col120 formatCol c b">
    <select class="col60" ng-model="positionTaking.mComm" ng-options="value for value in commRange">
    </select>
</td>
