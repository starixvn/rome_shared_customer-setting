<td class="formatCol l header">
    <span  ng-bind="betSetting.betTypeName"></span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input  ng-model="$parent.$parent.isCopyAll"  ng-switch-when="true"  ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, betSetting.betTypeId)"
            ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}" type="button" />
     </div>
</td>
<td class="formatCol">
        <input bet-setting-input  ng-model="betSetting.minBet" 
             value-range = "{'minName': '{{betSetting.upline.minBet}}' , 'min':{{betSetting.upline.minBet}}, 'maxName': 'Max Bet', 'max':{{betSetting.maxBet}}, 'model' :'Min Bet' }"
             ng-disabled="isDisabledByCopyAll"  class="r col50percent" type="text"title =""/>
        <span ng-model="betSetting.upline.minBet" bet-setting-constrain="1"></span>
</td>
<td class="formatCol" ng-switch="$parent.$parent.roleId">
        <div ng-switch-when="4">
            <input bet-setting-input ng-model="betSetting.maxBet" ng-disabled="isDisabledByCopyAll" 
             value-range = "{ 'minName': '' , 'min':-1, 'maxName': 'Max Per Match', 'max':{{betSetting.maxPerMatch}}, 'model' :'Max Bet'}"
              class="r col50percent"  type="text" title =""/>
        </div>
          <div ng-switch-default>
             <input bet-setting-input ng-model="betSetting.maxBet" ng-disabled="isDisabledByCopyAll" 
              value-range = "{ 'minName': '' , 'min':-1, 'maxName': 'Max Per Match', 'max':'Math.min({{betSetting.upline.maxBet}},{{betSetting.maxPerMatch}})', 'model' :'Max Bet'}"
              class="r col50percent"  type="text" title =""/>
            <span ng-model="betSetting.upline.maxBet" bet-setting-constrain="2"></span>
        </div>
        
</td>
<td class=" formatCol " ng-switch="$parent.$parent.roleId">
    <div ng-switch-when="4">
         <input bet-setting-input ng-model="betSetting.maxPerMatch" 
         value-range = "{ 'minName': '', 'min':-1,'maxName': '', 'max':-1, 'model' :'Max Per Match' }"
          class="r col50percent" type="text"  title =""   />
        </div>
          <div ng-switch-default>
          <input bet-setting-input ng-model="betSetting.maxPerMatch" 
          value-range = "{ 'minName': '', 'min':-1,'maxName': {{betSetting.upline.maxPerMatch}}, 'max':'{{betSetting.upline.maxPerMatch}}' , 'model' :'Max Per Match' }"
          class="r col50percent" type="text"  title ="" />
                 <span ng-model="betSetting.upline.maxPerMatch"  bet-setting-constrain="2"></span>
        </div>
</td>
<td class="formatCol c">
    <input ng-disabled="($parent.$parent.isCopyAll  && index != 0) || isStatusUIDisabled"
        type="checkbox" ng-model="betSetting.isEnabled" />
</td>
<td ng-if="$parent.roleId != 1" class="formatCol c">
    <input ng-disabled="($parent.$parent.isCopyAll  && index != 0) || isDownlinechkDisabled"
        type="checkbox" ng-model="betSetting.isDownlinesEnabled" />
</td>
