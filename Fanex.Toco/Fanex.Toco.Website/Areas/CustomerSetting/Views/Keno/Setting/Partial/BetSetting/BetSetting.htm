<td class="formatCol l header">
    <span>{{betSetting.betTypeName}}</span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}"
            ng-switch-when="true" ng-class-name="btnCopyAll" ng-model="$parent.$parent.isCopyAll"
            ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, betSetting.betTypeId)"
            type="button" /></div>
</td>
<td class="formatCol">
    <input ng-disabled="$parent.$parent.isCopyAll && index != 0" class="r col50percent"
        type="text" ng-model="betSetting.minBet" bet-setting-input min-value="{{betSetting.upline.minBet}}"
        max-value="{{betSetting.maxBet}}" />
    <span ng-model="betSetting.upline.minBet" bet-setting-constrain="1"></span>
</td>
<td class="formatCol">
    <input ng-disabled="$parent.$parent.isCopyAll  && index != 0" class="r col50percent"
        type="text" ng-model="betSetting.maxBet" bet-setting-input min-value="{{betSetting.minBet}}"
        max-value="{Math.min({{betSetting.upline.maxBet}},{{betSetting.maxPerMatch}})}" />
    <span ng-model="betSetting.upline.maxBet" bet-setting-constrain="2"></span>
</td>
<td class=" formatCol ">
    <input ng-disabled="$parent.$parent.isCopyAll  && index != 0" class="r col50percent"
        type="text" ng-model="betSetting.maxPerMatch" bet-setting-input min-value="{{betSetting.maxBet}}"
        max-value="{{betSetting.upline.maxPerMatch}}" />
    <span ng-model="betSetting.upline.maxPerMatch" bet-setting-constrain="2"></span>
</td>
<td class="formatCol c">
    <label class="checkbox">
        <input ng-disabled="isStatusUIDisabled || ($parent.$parent.isCopyAll  && index != 0)"
            type="checkbox" ng-model="betSetting.isEnabled" />
    </label>
</td>
<td class="formatCol c">
    <label class="checkbox">
        <input ng-disabled="isDownlinechkDisabled || ($parent.$parent.isCopyAll  && index != 0)"
            type="checkbox" ng-model="betSetting.isDownlinesEnabled" />
    </label>
</td>
