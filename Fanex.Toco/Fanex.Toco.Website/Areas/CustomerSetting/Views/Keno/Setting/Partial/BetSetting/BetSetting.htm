<td class="formatCol l header">
    <span>{{betSetting.betTypeName}}</span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}"
            ng-switch-when="true" ng-class-name="btnCopyAll" ng-model="$parent.$parent.isCopyAll"
            ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, betSetting.betTypeId)"
            type="button" /></div>
</td>
<td class="formatCol">
    <input ng-disabled="$parent.$parent.isCopyAll && index != 0" class="r col50percent"
        type="text" ng-model="betSetting.minBet" format="number" init-value="{{betSetting.maxBet}}"
        min-value="{{betSetting.upline.minBet}}" max-value="{{betSetting.maxBet}}" />
    <div class=" l divInline" ng-show="betSetting.upline.minBet >= 0">
        &gt;= {{betSetting.upline.minBet | number : 0}}
    </div>
</td>
<td class="formatCol">
    <input ng-disabled="$parent.$parent.isCopyAll  && index != 0" class="r col50percent"
        type="text" ng-model="betSetting.maxBet" format="number" init-value="{{betSetting.maxBet}}"
        min-value="{{betSetting.minBet}}" max-value="{Math.min({{betSetting.upline.maxBet}},{{betSetting.maxPerMatch}})}" />
    <div class=" l divInline" ng-show="betSetting.upline.maxBet >= 0">
        &lt;= {{betSetting.upline.maxBet | number : 0}}
    </div>
</td>
<td class=" formatCol ">
    <input ng-disabled="$parent.$parent.isCopyAll  && index != 0" class="r col50percent"
        type="text" ng-model="betSetting.maxPerMatch" format="number" init-value="{{betSetting.maxBet}}"
        min-value="{{betSetting.maxBet}}" max-value="{{betSetting.upline.maxPerMatch}}" />
    <div class=" l divInline" ng-show="betSetting.upline.maxPerMatch >= 0">
        &lt;= {{betSetting.upline.maxPerMatch | number : 0}}
    </div>
</td>
<td class="formatCol c">
    <label class="checkbox">
        <input ng-disabled="isStatusUIDisabled || ($parent.$parent.isCopyAll  && index != 0)"
            type="checkbox" ng-model="betSetting.isEnabled" />
    </label>
</td>
<td class="formatCol c">
    <label class="checkbox">
        <input ng-disabled="isDownlinechkDisabled || ($parent.$parent.isCopyAll  && index != 0)"
            type="checkbox" ng-model="betSetting.isDownlinesEnabled" />
    </label>
</td>
