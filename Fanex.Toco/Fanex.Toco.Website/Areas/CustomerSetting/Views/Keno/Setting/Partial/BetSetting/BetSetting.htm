<td class="formatCol l header">
    <span ng-bind="betSetting.betTypeName"></span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}"
            ng-switch-when="true" ng-class-name="btnCopyAll" ng-model="$parent.$parent.isCopyAll"
            ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, betSetting.betTypeId)"
            type="button" /></div>
</td>
<td class="formatCol">
        <input ng-disabled="isDisabledByCopyAll" ng-class="{'inputDisabled': isDisabledByCopyAll}" class="r col50percent"
            type="text" ng-model="betSetting.minBet" bet-setting-input min-value="{{betSetting.upline.minBet}}" title =""
            max-value="{{betSetting.maxBet}}" />
    <span ng-model="betSetting.upline.minBet" bet-setting-constrain="1"></span>
</td>
<td class="formatCol" ng-switch="$parent.$parent.roleId">
        <div ng-switch-when="4">
            <input  ng-disabled="isDisabledByCopyAll" ng-class="{'inputDisabled': isDisabledByCopyAll}" class="r col50percent"
                type="text" ng-model="betSetting.maxBet" bet-setting-input min-value="-1" title =""
                max-value="{{betSetting.maxPerMatch}}" />
        </div>
          <div ng-switch-default>
            <input  ng-disabled="isDisabledByCopyAll" ng-class="{'inputDisabled': isDisabledByCopyAll}" class="r col50percent"
                type="text" ng-model="betSetting.maxBet" bet-setting-input min-value="-1" title =""
                max-value="{Math.min({{betSetting.upline.maxBet}},{{betSetting.maxPerMatch}})}" />
            <span ng-model="betSetting.upline.maxBet" bet-setting-constrain="2"></span>
        </div>
        
</td>
<td class=" formatCol " ng-switch="$parent.$parent.roleId">
 <div ng-switch-when="4">
         <input ng-disabled="isDisabledByCopyAll" ng-class="{'inputDisabled': isDisabledByCopyAll}" class="r col50percent"
            type="text" ng-model="betSetting.maxPerMatch" bet-setting-input min-value="-1" title =""
            max-value="-1" />
        </div>
          <div ng-switch-default>
                <input ng-disabled="isDisabledByCopyAll" ng-class="{'inputDisabled': isDisabledByCopyAll}" class="r col50percent"
                type="text" ng-model="betSetting.maxPerMatch" bet-setting-input min-value="-1" title =""
                max-value="{{betSetting.upline.maxPerMatch}}" />
                 <span ng-model="betSetting.upline.maxPerMatch"
                    bet-setting-constrain="2"></span>
        </div>

</td>
<td class="formatCol c">
    <input ng-disabled="isDisabledByCopyAll || isStatusUIDisabled"
        type="checkbox" ng-model="betSetting.isEnabled" />
</td>
<td ng-if="$parent.roleId != 1" class="formatCol c">
    <input ng-disabled="isDisabledByCopyAll || isDownlinechkDisabled"
        type="checkbox" ng-model="betSetting.isDownlinesEnabled" />
</td>
