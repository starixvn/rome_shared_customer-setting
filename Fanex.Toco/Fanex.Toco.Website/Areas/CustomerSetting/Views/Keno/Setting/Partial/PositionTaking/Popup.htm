<div class="ngdialog-message">
    <h3>
        ngDialog template</h3>
    <p ng-show="theme">
        Test content for <code>{{theme}}</code></p>
    <p ng-show="ngDialogData.foo">
        Data passed through directive: <code>{{ngDialogData.foo}}</code></p>
</div>
<div class="ngdialog-buttons">
    <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-dialog="secondDialogId"
        ng-dialog-class="ngdialog-theme-default" ng-dialog-controller="SecondModalCtrl"
        ng-dialog-close-previous>
        Close</button>
    <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="openSecond()">
        Open next</button>
</div>
