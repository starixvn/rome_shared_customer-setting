<td class="formatCol l betSetting">
    <span ng-bind="positionTaking.betTypeName"></span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}"
            ng-switch-when="true" ng-model="$parent.$parent.isCopyAll"
            ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, positionTaking.betTypeId)"
            type="button" /></div>
</td>
<td class="formatCol c b betSetting">
    <select ie-select-fix = "{{fixIECount}}" ng-disabled="($parent.$parent.isCopyAll && index != 0) || positionTaking.iM2" ng-show="!positionTaking.iM1" class="col60" ng-model="positionTaking.m1" ng-options="value for value in m1Range">
    </select>
    <select ie-select-fix = "{{fixIECount}}" ng-disabled="$parent.$parent.isCopyAll && index != 0" ng-show="positionTaking.iM1 && !$parent.isDisableAutoMPT" class="col60" ng-model="positionTaking.uM1"
        ng-options="value for value in uM1Range">
    </select>
</td>
<td class="formatCol c b betSetting" ng-hide="$parent.isDisableAutoMPT">
    <input   ng-disabled="$parent.$parent.isCopyAll && index != 0" class="chb" type="checkbox" ng-model="positionTaking.iM1" />
</td>
<td class="formatCol c betSetting">
    <span ng-bind="positionTaking.a1"></span>
</td>
