<td class="formatCol l betSetting">
    <span ng-bind="positionTaking.betTypeName"></span>
    <div style="display: inline-block; float: right;" ng-switch="index == 0">
        <input ng-class="{'btnCopyAll' : $parent.$parent.isCopyAll, 'btnUnCopyAll' : !$parent.$parent.isCopyAll}"
            ng-switch-when="true"  ng-model="$parent.$parent.isCopyAll"
            ng-click="$parent.$parent.copyAll(!$parent.$parent.isCopyAll, positionTaking.betTypeId)"
            type="button" /></div>
</td>
<td class="formatCol c b betSetting">
    <select ie-select-fix = "{{fixIECount}}" ng-disabled="$parent.$parent.isCopyAll && index != 0" ng-show="!positionTaking.iM2" class="col60" ng-model="positionTaking.m2" ng-options="value for value in m2Range">
    </select>
    <select ie-select-fix = "{{fixIECount}}" ng-disabled="$parent.$parent.isCopyAll && index != 0" ng-show="positionTaking.iM2" class="col60" ng-model="positionTaking.uM2"
        ng-options="value for value in uM2Range">
    </select>
</td>
<td class="formatCol c b betSetting" ng-hide="positionTaking.isDisabledMPT">
    <input  ng-disabled="$parent.$parent.isCopyAll && index != 0" class="chb" type="checkbox" ng-model="positionTaking.iM2" />
</td>
<td class="formatCol c b betSetting">
    <select ie-select-fix = "{{fixIECount}}"  ng-disabled="$parent.$parent.isCopyAll && index != 0" class="col60" ng-model="positionTaking.a2" ng-options="value for value in maxPTRange">
    </select>
</td>
<td class="formatCol c b betSetting">
    <select ie-select-fix = "{{fixIECount}}" ng-disabled="$parent.$parent.isCopyAll && index != 0" class="col60" ng-model="positionTaking.n2" ng-options="value for value in minPTRange">
    </select>
</td>
