<div class="ngdialog-message">
    <div ng-bind="resources.lblConfirm"></div>
</div>
<div style="padding-left: 15px;" ng-switch="roleId">
      <div ng-switch-when="3" ng-bind="resources.lblHaveChangeMasterPositionTaking"> </div> <div ng-switch-default ng-bind="resources.lblHaveChangeMasterPositionTaking"></div></div>
<div style="padding-left: 15px;" ng-bind="resources.lblChangePTTo"></div>
<div ng-repeat="positionTaking in positionTakingList " ng-model="positionTaking">
    <div ng-if="positionTaking.isConfirmIsAuto" style="margin-top: 5px; padding-left: 50px;">
        <div class ="col100 " ng-bind="positionTaking.betTypeName" style="margin-right: 10px; display: inline-block"></div>
         <select ie-select-fix = "{{fixIECount}}" class="col60" ng-model="positionTaking.newMemberPT" ng-options="value for value in positionTaking.memberNewValueRange">
        </select>
    </div>
</div>
<div class="ngdialog-buttons">
    <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-dialog-class="ngdialog-theme-default"
        ng-click="setValueAllMember(false);" ng-dialog-close-previous>
        {{resources.lblNo}}</button>
    <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="setValueAllMember(true);">
         {{resources.lblYes}}</button>
</div>
